<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cassini-Huygens Viz</title>
    <meta
      name="description"
      content="An interactive 3D visualization of the Cassini-Huygens mission: 20 years orbiting Saturn, culminating in the spacecraft's final plunge into the planet's atmosphere on September 15, 2017."
    />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Grand Finale — Cassini-Huygens Mission"
    />
    <meta
      property="og:description"
      content="Watch Cassini's 13-year Saturn mission in 90 seconds."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='24' fill='%23e8c98a'/><ellipse cx='50' cy='50' rx='46' ry='9' fill='none' stroke='%23e8c98a' stroke-width='4'/></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
    />

    <!-- no external runtime deps, everything's bundled by Vite -->
  </head>
  <body>
    <!-- black background here, not CSS, so there's no white flash pre-paint -->
    <div
      id="root"
      style="background: #000; width: 100%; height: 100dvh; overflow: hidden"
    ></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
