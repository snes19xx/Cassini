<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Phones get the desktop layout zoomed to fit, the way the browser's
      "desktop site" mode does. Inline to land before first layout.
    -->
    <script>
      (function () {
        var PORTRAIT_LAYOUT_WIDTH = 980;
        // iOS Safari never swaps screen.width on rotation.
        var shortSide = Math.min(screen.width, screen.height);
        var longSide = Math.max(screen.width, screen.height);
        if (!matchMedia("(pointer: coarse)").matches || shortSide >= 500)
          return;
        var meta = document.querySelector('meta[name="viewport"]');
        var landscape = matchMedia("(orientation: landscape)");
        function apply() {
          // Landscape scales by the aspect to hold the portrait text size.
          var width = landscape.matches
            ? Math.round((PORTRAIT_LAYOUT_WIDTH * longSide) / shortSide)
            : PORTRAIT_LAYOUT_WIDTH;
          meta.setAttribute("content", "width=" + width);
        }
        apply();
        landscape.addEventListener("change", apply);
      })();
    </script>

    <title>Cassini-Huygens Mission</title>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="An interactive 3D visualization of the Cassini-Huygens mission: 20 years orbiting Saturn, culminating in the spacecraft's final plunge into the planet's atmosphere on September 15, 2017."
    />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Grand Finale — Cassini-Huygens Mission"
    />
    <meta
      property="og:description"
      content="Fly Cassini's 20-year journey, launch to the final plunge into Saturn, in under five minutes."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The Editorial theme pulls these two faces from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" keeps it off the first-paint path -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Needs crossorigin to match three's FileLoader request -->
    <link
      rel="preload"
      href="/assets/CassiniHuygensA_geo.glb"
      as="fetch"
      crossorigin="anonymous"
      fetchpriority="low"
    />
  </head>
  <body>
    <!-- black background here, not CSS, so there's no white flash pre-paint -->
    <div
      id="root"
      style="background: #000; width: 100%; height: 100dvh; overflow: hidden"
    ></div>

    <noscript>
      <div
        style="
          color: #ddd;
          background: #000;
          font: 16px/1.5 system-ui;
          padding: 2rem;
          text-align: center;
        "
      >
        This interactive 3D visualization of the Cassini-Huygens mission
        requires JavaScript and WebGL.
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
